# yolo11n-c2f-seg.yaml
# 学术创新点：验证 C3k2 在当前数据集的冗余性 (架构降维)
nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C2f, [256, False]]       # ✨ 降级为 v8 的 C2f
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C2f, [512, False]]       # ✨ 降级为 v8 的 C2f
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C2f, [512, True]]        # ✨ 降级为 v8 的 C2f
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C2f, [1024, True]]       # ✨ 降级为 v8 的 C2f
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]           # 保留注意力机制做控制变量

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C2f, [512, False]]       # ✨ 降级

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C2f, [256, False]]       # ✨ 降级

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C2f, [512, False]]       # ✨ 降级

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C2f, [1024, True]]       # ✨ 降级

  - [[16, 19, 22], 1, Segment, [nc, 32, 256]]