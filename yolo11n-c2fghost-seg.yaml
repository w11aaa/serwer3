# yolo11n-c2fghost-seg.yaml
# 不改源码！融合 v11 特性与 C2fGhost 轻量化模块
nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, GhostConv, [128, 3, 2]]
  - [-1, 2, C2fGhost, [256, False]]   # ✨ 舍弃 C3k2，调用自带的 C2fGhost
  - [-1, 1, GhostConv, [256, 3, 2]]
  - [-1, 2, C2fGhost, [512, False]]   # ✨ 替换
  - [-1, 1, GhostConv, [512, 3, 2]]
  - [-1, 2, C2fGhost, [512, True]]    # ✨ 替换
  - [-1, 1, GhostConv, [1024, 3, 2]]
  - [-1, 2, C2fGhost, [1024, True]]   # ✨ 替换
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]            # 保留 v11 的灵魂注意力机制

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C2fGhost, [512, False]]   # ✨ 替换颈部

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C2fGhost, [256, False]]   # ✨ 替换颈部

  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C2fGhost, [512, False]]   # ✨ 替换颈部

  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C2fGhost, [1024, True]]   # ✨ 替换颈部

  - [[16, 19, 22], 1, Segment, [nc, 32, 256]]