# yolo11n-liteneck-seg.yaml
# 学术创新点：非对称解耦设计，强主干 + 极简颈部
nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # ⚠️ 主干网络完全保持 YOLOv11 原生架构，确保特征提取能力！
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  # ✨ 颈部网络：全部换成轻量的 C2fGhost 模块！
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C2fGhost, [512, False]]   # ✨ 替换

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C2fGhost, [256, False]]   # ✨ 替换

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C2fGhost, [512, False]]   # ✨ 替换

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C2fGhost, [1024, True]]   # ✨ 替换

  - [[16, 19, 22], 1, Segment, [nc, 32, 256]]