# yolo11n-ghost-cbam-seg.yaml
# 纯 YAML 魔改：在 Ghost 基础中注入 CBAM 注意力补偿精度
nc: 1
scales:
  n: [0.50, 0.25, 1024] 

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, GhostConv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]] 
  - [-1, 1, GhostConv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] 
  - [-1, 1, GhostConv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]       
  - [-1, 1, GhostConv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]      
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, CBAM, [1024]]            # ✨ 核心创新：在这里插入原生 CBAM！
  - [-1, 2, C2PSA, [1024]]           

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]      

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]      

  - [-1, 1, GhostConv, [256, 3, 2]]  
  - [[-1, 13], 1, Concat, [1]]       
  - [-1, 2, C3k2, [512, False]]      

  - [-1, 1, GhostConv, [512, 3, 2]]  
  - [[-1, 11], 1, Concat, [1]]       # ⚠️ 注意这里：因为加了一层 CBAM，原先的 10 变成了 11！
  - [-1, 2, C3k2, [1024, True]]      

  - [[16, 19, 22], 1, Segment, [nc, 32, 256]]