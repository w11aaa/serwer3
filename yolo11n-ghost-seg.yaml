# yolo11n-ghost-seg.yaml
# YOLO11 官方架构基础上引入 GhostConv 替换标准卷积

# 参数设定 (针对 n 纳米模型)
nc: 1  # 你的下水道类别数
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] 

# YOLO11-Ghost Backbone (主干网络)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2  (第一层保留普通卷积，提取浅层边缘特征)
  - [-1, 1, GhostConv, [128, 3, 2]]  # 1-P2/4  (替换为 GhostConv，下采样并降参)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, GhostConv, [256, 3, 2]]  # 3-P3/8  (替换为 GhostConv)
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, GhostConv, [512, 3, 2]]  # 5-P4/16 (替换为 GhostConv)
  - [-1, 2, C3k2, [512, True]]       # 6
  - [-1, 1, GhostConv, [1024, 3, 2]] # 7-P5/32 (替换为 GhostConv)
  - [-1, 2, C3k2, [1024, True]]      # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]           # 10 (保留 YOLO11 特有的 C2PSA 注意力机制)

# YOLO11-Ghost Head (头部/颈部网络)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]        # cat backbone P4
  - [-1, 2, C3k2, [512, False]]      # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]        # cat backbone P3
  - [-1, 2, C3k2, [256, False]]      # 16 (P3/8-small)

  - [-1, 1, GhostConv, [256, 3, 2]]  # 17 (替换颈部下采样卷积)
  - [[-1, 13], 1, Concat, [1]]       # cat head P4
  - [-1, 2, C3k2, [512, False]]      # 19 (P4/16-medium)

  - [-1, 1, GhostConv, [512, 3, 2]]  # 20 (替换颈部下采样卷积)
  - [[-1, 10], 1, Concat, [1]]       # cat head P5
  - [-1, 2, C3k2, [1024, True]]      # 22 (P5/32-large)

  # YOLO11 实例分割头 (对接 16, 19, 22 层)
  - [[16, 19, 22], 1, Segment, [nc, 32, 256]]  # 23