# yolo11n-dw-seg.yaml
# 学术创新点：引入 DWConv 替代标准下采样卷积，探索极致轻量化
nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2
  - [-1, 1, DWConv, [128, 3, 2]]      # ✨ 替换为 DWConv
  - [-1, 2, C3k2, [256, False, 0.25]] 
  - [-1, 1, DWConv, [256, 3, 2]]      # ✨ 替换为 DWConv
  - [-1, 2, C3k2, [512, False, 0.25]] 
  - [-1, 1, DWConv, [512, 3, 2]]      # ✨ 替换为 DWConv
  - [-1, 2, C3k2, [512, True]]       
  - [-1, 1, DWConv, [1024, 3, 2]]     # ✨ 替换为 DWConv
  - [-1, 2, C3k2, [1024, True]]      
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]      

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]      

  - [-1, 1, DWConv, [256, 3, 2]]      # ✨ 替换颈部下采样
  - [[-1, 13], 1, Concat, [1]]       
  - [-1, 2, C3k2, [512, False]]      

  - [-1, 1, DWConv, [512, 3, 2]]      # ✨ 替换颈部下采样
  - [[-1, 10], 1, Concat, [1]]       
  - [-1, 2, C3k2, [1024, True]]      

  - [[16, 19, 22], 1, Segment, [nc, 32, 256]]